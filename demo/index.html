ine{border-left:1px solid #d5ddcf;margin-left:5px;padding-left:19px}.timeline .card{position:relative}.timeline .card:before{content:'';width:7px;height:7px;border-radius:50%;background:#9aaf8c;position:absolute;left:-24px;top:23px}.choice{border:1px solid var(--line);padding:18px;border-radius:17px;background:#fffdf8;margin-top:10px;text-align:left;width:100%;line-height:1.7}.choice.selected{border-color:var(--green);background:#e8efdf}.danger{color:#9c6757;font-size:12px}.notice{background:#eeeade;padding:14px;border-radius:13px;font-size:12px;line-height:1.8;margin-top:16px}textarea{width:100%;border:1px solid #cbd4c5;background:#fffdf8;border-radius:14px;padding:15px;min-height:110px;resize:vertical;line-height:1.7;color:var(--ink)}.toast{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);background:#263d35;color:white;border-radius:14px;padding:13px 20px;z-index:10;font-size:13px;max-width:90vw}.metric{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.pulse{height:65px;display:flex;align-items:center;gap:4px;margin:14px 0}.pulse i{flex:1;background:#bccdaf;border-radius:3px;height:var(--h)}.tabbar{display:flex;gap:8px;margin:17px 0}.tabbar button{border-radius:20px;background:#ebece4;padding:9px 15px}.tabbar .selected{background:var(--green);color:white}.footer-note{text-align:center;color:#91988c;font-size:10px;margin:24px 0}.progress{height:4px;background:#dfe5d7;border-radius:5px;margin:20px 0}.progress i{height:100%;display:block;background:var(--green);border-radius:5px}.switch{padding:7px 12px;border-radius:20px;background:var(--green);color:white;font-size:11px}@media(max-width:480px){body{background:var(--bg)}.phone{margin:0;border-radius:0;min-height:100dvh;box-shadow:none}.nav{position:fixed;max-width:430px;margin:auto}.content{min-height:calc(100dvh - 130px)}}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>◔ ▰ ▰</span></div><div id="app"></div></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={self:'我是一个习惯独处时最有能量的内容创作者',goal:'你想成为能持续表达自己的人',traits:['独处充电','界限分明','能坚持','喜欢思辨','感受敏锐','真诚'],opened:false,direction:'',history:[],pause:false};let state;try{state={...initial,...JSON.parse(localStorage.getItem('nuna-demo')||'{}')}}catch{state={...initial}}let stack=[],page='home',param='',selected=-1,question=0,answers=[];
const candidates=['我是一个习惯独处时最有能量的内容创作者','我是一个追求真实但不太容易被说动的人','我是一个用深度思考丈量世界的独立创作者','我是一个感受敏锐但始终在追求平稳的人','我是一个信奉长期主义、用内容影响他人的人','我是一名独立创作者','我是一个重视真实的人','我是一个在独处时恢复能量的人','我是一个感受敏锐的人','我是一个希望持续表达自己的人'];
const traitEvidence={'独处充电':['周末没有约人，在家读了半天书，感觉能量回来了。','我习惯独处时最有能量。'],'界限分明':['这部分不在我负责的范围内，我可以帮忙梳理，但不能一直替你做。','我是一个不太容易被说动的人。'],'能坚持':['文章又发了一篇，这周的计划完成了。','我想把每周写作一直做下去。'],'喜欢思辨':['我在读《存在与时间》，一直在想“向死而生”是什么意思。','我喜欢把一个问题想透再表达。'],'感受敏锐':['今天对方说话的语气变了，我一下就注意到了。','我是一个感受很细的人。'],'真诚':['我这人就是看不得不公平。','合作里我还是希望把真实情况说清楚。']};
function save(){localStorage.setItem('nuna-demo',JSON.stringify(state))}function toast(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2400)}function go(p,a=''){stack.push([page,param]);page=p;param=a;render();window.scrollTo(0,0)}function back(){[page,param]=stack.pop()||['home',''];render();window.scrollTo(0,0)}function home(){stack=[];page='home';render();window.scrollTo(0,0)}
function header(title){return `<div class="top"><div class="row"><button class="back" onclick="back()" aria-label="返回">‹</button><span class="page-title">${title}</span></div><span class="small">NUNA</span></div>`}function nav(){return `<nav class="nav"><button onclick="go('moments')"><span>◷</span>情绪</button><button onclick="go('records')"><span>▤</span>记录</button><button class="active" onclick="home()"><span>✳</span>画像</button><button onclick="go('settings')"><span>◉</span>我的</button></nav>`}function title(k,t,d){return `<div class="detail-head"><div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${d}</p></div>`}function evidence(text,date='10月10日 · 工作讨论'){return `<button class="card full" onclick="go('moment',decodeURIComponent('${encodeURIComponent(JSON.stringify({text,date})).replace(/'/g,'%27')}'))"><span class="muted">${date} · 我的声音</span><div class="quote">“${esc(text)}”</div><div class="row"><span class="link">回到这个时刻</span><span class="arrow">↗</span></div></button>`}
function render(){let html='';if(page==='home'){html=`<div class="top"><span class="brand">nuna<span style="color:#899c7f"> ·</span></span><button class="icon" onclick="go('settings')" aria-label="画像设置">⚙</button></div><div class="content"><div class="small">A PORTRAIT OF YOU</div><h1>慢慢，看见自己。</h1><p class="muted">林遥，你的画像正在日常里变得清晰。</p><button class="hero full" onclick="go('self')"><div class="row"><span class="eyebrow">一句话里的我</span><span class="pill">你已确认</span></div><blockquote>${esc(state.self)}</blockquote><div class="row"><span class="muted">由日常表达与行为逐步形成</span><span class="arrow">↗</span></div></button><section class="section"><div class="row"><h2>日常中的性格</h2><button class="link" onclick="go('traits')">了解更多 ↗</button></div><div class="chips">${state.traits.map(t=>`<button class="chip" onclick="go('trait','${t}')">${t}</button>`).join('')}</div></section><section class="section"><div class="row"><h2>我想成为</h2><button class="link" onclick="go('category','未来方向')">全部 ↗</button></div><button class="card full" onclick="go('goal')"><span class="tag">进行中</span><div class="goal-title">${esc(state.goal)}</div><div class="branch">每周发布一篇文章<br>完成一次公开分享</div></button></section><section class="section"><h2>关于我的五个侧面</h2><div class="categories">${[['身份与生活','◈','独立创作者 · 生活节奏'],['兴趣与关注','✺','阅读 · 音乐 · 城市'],['信念与价值观','◇','真实 · 自由'],['性格与人格','✳','日常特质 · 人格探索'],['未来方向','↗','想成为的人，与想做的事']].map(([n,i,d])=>`<button class="category" onclick="go('category','${n}')"><div><i class="cat-icon">${i}</i><b>${n}</b><span>${d}</span></div>${n==='未来方向'?'<span class="arrow">↗</span>':''}</button>`).join('')}</div></section><section class="section"><button class="card insight full" onclick="go('insight')"><div class="row"><div class="seal">✧</div><span class="pill">${state.opened?'本轮已打开':'本轮可以打开'}</span></div><h3 style="margin-top:18px">每周，换个角度看自己</h3><p class="muted">${state.opened?'回看你已经打开的洞察。':'一些你尚未注意到的自己，等你主动打开。'}</p><span class="link">${state.opened?'回看本轮':'选择方向，打开洞察'} ↗</span></button></section><section class="section"><div class="row"><h2>画像的变化</h2><button class="link" onclick="go('updates')">查看 ↗</button></div><p class="muted">10月10日 · 「能坚持」的依据更丰富了</p></section><p class="footer-note">来自你的声音，由你确认与校准</p></div>${nav()}`}
else{html=header(({self:'一句话里的我',candidates:'选择自我描述',traits:'日常中的性格',trait:'性格详情',goal:'长远目标',edit:'编辑长远目标',category:param,tag:'标签详情',insight:'每周挑战性洞察',reveal:'本轮洞察',moment:'那个时刻',moments:'情绪时刻',records:'语音记录',settings:'画像设置',updates:'画像的变化',test:'人格探索',quiz:'探索问答',result:'探索结果',history:'自我描述历史'})[page]||'我的画像')+'<div class="content">';
if(page==='traits')html+=title('EVERYDAY SELF','日常中的你','稳定倾向，从日常表达与行为中逐步浮现。')+state.traits.map(t=>`<button class="card full row" onclick="go('trait','${t}')"><div><h3>${t}</h3><span class="muted">查看依据与变化</span></div><span class="arrow">↗</span></button>`).join('')+'<div class="notice">暂时的情绪反应不会直接成为性格标签。</div>';
if(page==='trait'){let e=traitEvidence[param]||traitEvidence['能坚持'];html+=title('EVERYDAY SELF',esc(param),'来自你的行为表述与日常自评')+'<span class="tag">日常记录形成</span><section class="section"><h2>为什么这样理解你</h2><p class="muted">这些记录支持了这个判断。</p>'+evidence(e[0])+evidence(e[1],'10月6日 · 个人表达')+'</section><section class="section"><h2>你也有不同的时刻</h2>'+evidence('今天我选择了和平时不同的方式，想试试看。','10月4日 · 日常分享')+'</section><section class="section"><h2>变化路径</h2><p class="muted">10月10日 · 新依据加入，表述保持不变<br>9月26日 · 首次出现在画像中</p></section><button class="secondary danger" onclick="rejectTrait()">这条结论不符合我</button>'}
if(page==='self')html+=title('SENSE OF SELF','一句话，描述现在的我','只在你确认之后，才会替换当前描述。')+`<div class="hero"><span class="pill">你已确认</span><blockquote>${esc(state.self)}</blockquote></div><section class="section"><h2>这句话从哪里来</h2><button class="card full row" onclick="go('traits')"><span>性格特质 · 独处充电、喜欢思辨</span><span>↗</span></button><button class="card full row" onclick="go('goal')"><span>长远目标 · 持续表达自己</span><span>↗</span></button>${evidence('我习惯独处时最有能量。','10月6日 · 个人表达')}</section><button class="primary" onclick="selected=-1;go('candidates')">看看其他描述</button><button class="secondary" onclick="go('history')">查看历史版本</button>`;
if(page==='candidates')html+=title('YOUR WORDS','哪一句，更像你？','可以慢慢选。不确认，当前描述就会保留。')+candidates.map((c,i)=>`${i===0?'<h3>综合描述</h3>':i===5?'<h3 style="margin-top:25px">从一个侧面看自己</h3>':''}<button class="choice ${selected===i?'selected':''}" onclick="selected=${i};render()">${esc(c)}${selected===i?'　✓':''}</button>`).join('')+`<button class="primary" onclick="confirmSelf()">用这句话描述我</button>`;
if(page==='history')html+=title('VERSIONS','每个阶段，都算数','保留你确认过的描述。')+`<div class="card"><span class="tag">当前</span><p>${esc(state.self)}</p></div>`+state.history.map(x=>`<div class="card"><span class="muted">${esc(x.date)} · 已替换</span><p>${esc(x.text)}</p></div>`).join('')+'<div class="card"><span class="muted">9月18日 · 已替换</span><p>我是一个重视真实的人</p></div>';
if(page==='goal')html+=title('BECOMING','我想成为','愿望是根，行动让它慢慢生长。')+`<div class="card"><span class="tag">进行中</span><div class="goal-title">${esc(state.goal)}</div><span class="muted">由你编辑 · 保留原有表达</span><div class="branch">✓ 每周发布一篇文章<br>○ 完成一次公开分享<br>○ 建立自己的选题库</div><button class="link" onclick="go('edit')">编辑目标 ↗</button></div><section class="section"><h2>从愿望到行动</h2>${evidence('我决定了，今年要持续写下去，用内容影响他人。','9月18日 · 个人表达')}${evidence('文章又发了一篇。','10月10日 · 创作记录')}</section><section class="section"><h2>进展记录</h2><p class="muted">${(state.goalHistory||[]).map(x=>esc(x.date)+' · 由你编辑：'+esc(x.text)).join('<br>')}${state.goalHistory?.length?'<br>':''}10月10日 · 完成一篇文章<br>9月18日 · 目标成立</p></section><div class="notice">一次行动完成，不代表你想成为的角色已经结束。</div>`;
if(page==='edit')html+=title('YOUR DIRECTION','用你的话，更新目标','修改会保留在目标变化记录中。')+`<textarea id="goalinput" aria-label="长远目标">${esc(state.goal)}</textarea><button class="primary" onclick="saveGoal()">保存目标</button><button class="secondary" onclick="back()">保留原来的表达</button>`;
if(page==='category')html+=category(param);
if(page==='tag')html+=title('ABOUT YOU',esc(param),'来自你的日常表达')+`<span class="tag">${param==='自媒体博主'?'行为推断':param==='Taylor Swift'?'喜欢':'日常记录'}</span><section class="section"><h2>相关表达</h2>${evidence(({真实:'我希望把真实的情况说清楚。',自由:'我想活出真实，不被定义。','Taylor Swift':'我去听了 Taylor Swift 的新专辑。','存在与时间':'我在读《存在与时间》。',自媒体博主:'今天录了一期视频，文章又发了一篇。'})[param]||'我最近一直在关注这个话题。')}</section><button class="secondary" onclick="toast('已记录你的反馈：这条标签不符合我')">这条标签不符合我</button>`;
if(page==='insight')html+=title('A DIFFERENT ANGLE','你想看哪一面？','由你决定，什么时候面对新的发现。')+`<div class="card insight"><div class="seal">✧</div><p>把你对自己的看法、你在意的特质与实际记录放在一起，看看它们之间的反差。</p></div>`+(state.opened?`<div class="notice">本轮已选择：${state.direction==='positive'?'未注意到的优势':'值得面对的反差'}。再次打开新一轮需间隔一周。</div><button class="primary" onclick="go('reveal',state.direction)">回看本轮洞察</button>`:`<button class="choice" onclick="openInsight('positive')"><h3>✧ 看看我没注意到的优势</h3><span class="muted">也许你比自己想象的更有力量。</span></button><button class="choice" onclick="openInsight('negative')"><h3>◇ 看看值得面对的反差</h3><span class="muted">带着好奇，看看另一面的自己。</span></button><p class="muted" style="margin-top:20px">打开后，本轮方向会保留。洞察内容不会提前出现在通知里。</p>`);
if(page==='reveal'){const positive=param==='positive';html+=title('WEEKLY INSIGHT',positive?'你已经在坚持了':'有时，你也把结果放在前面','本轮已打开 · 来自三项信息的比对')+`<div class="hero"><p style="font-size:19px">${positive?'你说自己不够自律，也欣赏能坚持的人。但持续发布内容的记录，已经呈现出你没有注意到的坚持。':'你说自己不太会经营关系，也不喜欢只看结果的做法；部分合作表达，却呈现出你会主动权衡结果的一面。'}</p></div><section class="section"><h2>把三项依据放在一起</h2><h3 style="margin-top:18px">你如何看待自己</h3>${evidence(positive?'我觉得自己不算一个能坚持的人。':'我不是一个很会经营关系的人。','9月22日 · 自我表达')}<h3 style="margin-top:20px">你如何看待这种特质</h3>${evidence(positive?'我挺欣赏那些能一直坚持下去的人。':'我不喜欢凡事只看结果的做法。','9月25日 · 日常分享')}<h3 style="margin-top:20px">实际记录中的你</h3>${evidence(positive?'文章又发了一篇，这周也没有断。':'和品牌谈了个合作，我先考虑了长期收益。')}</section><button class="secondary danger" onclick="dismissInsight()">这条洞察不符合我</button><p class="muted">本页为示例内容，用于体验洞察流程。</p>`}
if(page==='moment'){let source;try{source=JSON.parse(param)}catch{source={text:'这部分不在我负责的范围内，我可以帮忙梳理，但不能一直替你做。',date:'10月10日 · 项目讨论'}};html+=title('A MOMENT IN YOUR DAY','回到当时的表达',esc(source.date)+' · 关联时段')+`<div class="card"><div class="row"><h3>情绪状态</h3><span class="tag">平稳 → 紧绷 → 平稳</span></div><div class="pulse">${[25,29,22,32,40,52,61,48,55,40,32,25,28,21,23,19,24,18,23,21].map(h=>`<i style="--h:${h}px"></i>`).join('')}</div><div class="row muted"><span>14:20</span><span>心率变化示意</span><span>14:42</span></div><p class="muted">生理变化是情绪判断的参考，需要结合当时情境理解。</p></div><div class="card"><h3>对话摘要</h3><p>${esc(source.text)}</p></div><div class="card"><div class="row"><h3>关联语音片段</h3><span class="tag">我的声音</span></div><div class="quote">“${esc(source.text)}”</div><p class="muted">已依据注册时录入的声纹识别归属</p><button class="link" onclick="toast('示例转写已完整显示；此 Demo 不含真实录音')">查看完整转写</button></div><div class="row"><button class="link" onclick="toast('已标记说话人归属待复核')">这不是我说的</button><button class="link" onclick="toast('已标记转写待复核')">转写不准确</button></div>`;}
if(page==='moments'||page==='records')html+=title(page==='moments'?'EMOTIONAL MOMENTS':'DAILY RECORDS',page==='moments'?'今天的情绪时刻':'你的日常记录','点击记录，查看情绪与对话的关联。')+`<button class="card full" onclick="go('moment')"><span class="muted">14:20 · 项目讨论</span><h3 style="margin-top:12px">表达边界的那一刻</h3><p class="muted">平稳 → 紧绷 → 平稳　↗</p></button><button class="primary" onclick="home()">回到我的画像</button>`;
if(page==='updates')html+=title('GROWING WITH YOU','画像的变化','看见变化，也能回到当时的依据。')+`<div class="timeline"><button class="card full" onclick="go('trait','能坚持')"><span class="muted">10月10日</span><p>「能坚持」的依据更丰富了</p><span class="link">查看变化 ↗</span></button><button class="card full" onclick="go('goal')"><span class="muted">10月6日</span><p>长远目标新增了一项相关行动</p></button><button class="card full" onclick="go('self')"><span class="muted">9月28日</span><p>你确认了新的一句话描述</p></button></div>`;

if(page==='test')html+=title('PERSONALITY EXPLORATION','用几个问题，认识自己','测试结果与日常形成的特质分别保留。')+`<div class="card"><span class="tag">可选探索</span><h3 style="margin-top:12px">我的社交与决策偏好</h3><p class="muted">3 个示例问题 · 可返回修改</p><div class="notice">此处演示答题与结果流程。附件未提供完整题库，因此不生成 MBTI 等正式人格类型。</div><button class="primary" onclick="question=0;answers=[];go('quiz')">开始探索</button></div><div class="card"><h3>日常中的我</h3><p class="muted">持续积累的性格特质，来自你的真实表达与行为。</p><button class="link" onclick="go('traits')">查看我的特质 ↗</button></div>`;
if(page==='quiz'){let qs=[['忙碌一周后，你更想怎样恢复能量？',['独处，做一点自己的事','见朋友，在交流中放松']],['面对一个新想法，你通常先做什么？',['想清楚它的逻辑与可能性','先尝试，再根据体验调整']],['遇到工作范围不清晰的请求，你倾向于？',['先说明边界，再讨论协助方式','先帮忙，再协调后续安排']]];html+=title('EXPLORE YOURSELF',`第 ${question+1} / 3 题`,'根据自己的感受选择，没有更好的答案。')+`<div class="progress"><i style="width:${(question+1)/3*100}%"></i></div><h2 style="line-height:1.8">${qs[question][0]}</h2>`+qs[question][1].map((a,i)=>`<button class="choice ${answers[question]===i?'selected':''}" onclick="answers[question]=${i};render()">${a}</button>`).join('')+`<button class="primary" onclick="nextQuestion()">${question===2?'查看示例结果':'下一题'}</button>${question>0?'<button class="secondary" onclick="question--;render()">上一题</button>':''}`}
if(page==='result')html+=title('EXPLORATION RESULT','你选择的偏好','来自本次示例问答 · 与日常特质分别呈现')+`<div class="hero"><h3>${answers[0]===0?'独处恢复能量':'交流恢复能量'}</h3><p>${answers[1]===0?'倾向先思考再行动':'倾向在尝试中获得反馈'}</p><p>${answers[2]===0?'倾向先表达边界':'倾向先提供协助'}</p></div><div class="notice">这是你的三次选择的摘要，不是经过验证的人格测评结果，也不会覆盖日常性格画像。</div><button class="primary" onclick="home()">回到画像</button>`;
html+='</div>'+nav()}$('#app').innerHTML=html}
function category(n){let out=title('FIVE SIDES OF YOU',n,'从日常中形成，点击内容查看依据。');if(n==='身份与生活')out+=`<h3>职业身份</h3><button class="card full" onclick="go('tag','自媒体博主')"><span class="tag">行为推断</span><h3 style="margin-top:12px">自媒体博主</h3><p class="muted">录视频、写文章、品牌合作等多条记录共同支持。</p></button><section class="section"><h3>生活节奏</h3><div class="card"><p>这一侧面还在整理中</p><p class="muted">作息标签规则尚未完整定义，此原型不生成推断。</p></div></section>`;
if(n==='兴趣与关注')out+=`<h3>爱好</h3><div class="card"><div class="row"><h3>音乐</h3><span class="muted">具体喜好</span></div><button class="chip" onclick="go('tag','Taylor Swift')">Taylor Swift · 喜欢</button><button class="link" onclick="toast('感兴趣：陶喆、独立音乐（示例）')">＋2 个感兴趣</button></div><div class="card"><h3>阅读</h3><button class="chip" onclick="go('tag','存在与时间')">《存在与时间》· 喜欢</button></div><div class="card"><h3>城市 / 旅行</h3><button class="chip" onclick="go('tag','巴黎')">巴黎 · 喜欢</button></div><section class="section"><h3>近期关注</h3><button class="card full" onclick="go('tag','AI 与独立创作')">AI 与独立创作 <span class="arrow">↗</span></button><p class="muted">关注话题与爱好分别保留。</p></section>`;
if(n==='信念与价值观')out+=`<div class="chips">${['真实','自由'].map(t=>`<button class="chip" onclick="go('tag','${t}')">${t}</button>`).join('')}</div><div class="notice">这些关键词表达你在意的事。它们保持独立，不直接作为人格特质的判定结果。</div>`;
if(n==='性格与人格')out+=`<button class="card full" onclick="go('traits')"><h3>日常中的我 ↗</h3><p class="muted">从日常表达与行为形成的稳定倾向</p><div class="chips">${state.traits.slice(0,3).map(t=>`<span class="chip">${t}</span>`).join('')}</div></button><button class="card full" onclick="go('test')"><h3>人格探索 ↗</h3><p class="muted">主动完成少量问题，探索自己的偏好。</p><span class="tag">可选测试</span></button>`;
if(n==='未来方向')out+=`<h3>我想成为什么样的人</h3><button class="card full" onclick="go('goal')"><span class="tag">进行中</span><p class="goal-title">${esc(state.goal)}</p><span class="link">查看目标与相关行动 ↗</span></button><section class="section"><h3>我想做成什么事</h3><div class="card"><span class="tag">本周</span><p>发布一篇文章</p><span class="muted">相关行动 · 已完成</span></div><div class="card"><span class="tag">今年</span><p>完成一次公开分享</p><span class="muted">相关行动 · 进行中</span></div></section><section class="section"><h3>还在考虑</h3><div class="card"><p>以后有机会，想做一期播客</p><span class="muted">暂存意向，尚未成立为目标</span></div></section>`;return out}
function confirmSelf(){if(selected<0)return toast('先选择一句更像你的描述');if(state.self!==candidates[selected])state.history.unshift({text:state.self,date:new Date().toLocaleDateString('zh-CN')});state.self=candidates[selected];save();back();toast('已确认新的自我描述，旧版本已保留')}
function saveGoal(){let value=$('#goalinput').value.trim();if(!value)return toast('请保留一段目标描述');if(value!==state.goal){state.goalHistory=state.goalHistory||[];state.goalHistory.unshift({text:state.goal,date:new Date().toLocaleDateString('zh-CN')})}state.goal=value;save();back();toast('目标已保存，由你编辑')}
function rejectTrait(){if(!confirm('移除这条性格结论？之后重新呈现时需要你的确认。'))return;state.traits=state.traits.filter(t=>t!==param);save();back();toast('已移除该结论')}

const originalRender=render;render=function(){if(page==='reveal'&&state.dismissed){$('#app').innerHTML=header('本轮洞察')+'<div class="content">'+title('WEEKLY INSIGHT','本轮洞察已移除','你的否定已记录。本轮不再显示这条内容。')+'<button class="primary" onclick="home()">回到画像</button></div>'+nav();return}originalRender()};
function nextQuestion(){if(answers[question]===undefined)return toast('请选择符合你的选项');if(question<2){question++;render()}else go('result')}function resetDemo(){if(!confirm('重置所有示例交互与编辑？'))return;state=JSON.parse(JSON.stringify(initial));save();home();toast('示例已重置')}render();
</script></body></html>
